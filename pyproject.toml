[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metricsthinking"
version = "5.0.0"
description = "Universal Technology Project Reverse Engineering & Ground Truth Audit Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "HyperScale Thinking Systems", email = "engineering@hyperscalethinking.com" }
]
keywords = [
    "audit",
    "metrics",
    "reverse-engineering",
    "ground-truth",
    "project-governance",
    "mermaid",
    "architecture"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "jsonschema>=4.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "jsonschema>=4.19.0",
]

[project.scripts]
metricsthinking = "metricsthinking.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metricsthinking"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]
lint.ignore = ["E501", "T201", "W291", "RET504"]


[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
