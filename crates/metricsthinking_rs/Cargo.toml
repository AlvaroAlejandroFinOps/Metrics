[package]
name = "metricsthinking_rs"
version = "4.0.0"
edition = "2021"
description = "Native high-performance accelerator for MetricsThinking v4.0 (PyO3 single-pass scanning, AST, entropy, and shingling)"
license = "MIT"

[lib]
name = "_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
rayon = "1.8"
ignore = "0.4"
sha2 = "0.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
