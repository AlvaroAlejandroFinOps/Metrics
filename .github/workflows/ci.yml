name: MetricsThinking CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Run unit and integration tests with pytest
        run: |
          python -m pytest tests/ -v

      - name: Self-Audit with MetricsThinking v4.0 Holistic Governance
        run: |
          python -m metricsthinking.cli audit --target . --profile default --prune --medallion
